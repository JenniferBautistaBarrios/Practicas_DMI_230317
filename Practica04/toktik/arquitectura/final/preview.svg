<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Arquitectura final de KittyTokTik: proveedor, repositorio y fuentes de datos</title>
  <desc id="desc">El flujo de presentación llega al proveedor, repositorio, fuentes de datos remotas y persistencia local.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101f32"/><stop offset="1" stop-color="#153f51"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#70e0c2"/></marker></defs>
  <rect width="1200" height="560" rx="28" fill="url(#bg)"/><text x="56" y="68" fill="#70e0c2" font-family="Arial,sans-serif" font-size="17" letter-spacing="3">KITTYTOKTIK · ARQUITECTURA FINAL</text><text x="56" y="116" fill="#fff" font-family="Arial,sans-serif" font-size="34" font-weight="700">Proveedor, repositorio y fuentes de datos</text>
  <g font-family="Arial,sans-serif" text-anchor="middle"><g><rect x="45" y="205" width="185" height="155" rx="20" fill="#172c40" stroke="#8bc9ff" stroke-width="2"/><text x="137" y="255" fill="#8bc9ff" font-size="16">PRESENTACIÓN</text><text x="137" y="295" fill="#fff" font-size="20" font-weight="700">Discovery</text><text x="137" y="326" fill="#c5d7e7" font-size="15">Pantalla y widgets</text></g><g><rect x="270" y="205" width="185" height="155" rx="20" fill="#172c40" stroke="#bea0ff" stroke-width="2"/><text x="362" y="255" fill="#bea0ff" font-size="16">ESTADO</text><text x="362" y="295" fill="#fff" font-size="20" font-weight="700">Provider</text><text x="362" y="326" fill="#c5d7e7" font-size="15">Orquesta el feed</text></g><g><rect x="495" y="205" width="185" height="155" rx="20" fill="#172c40" stroke="#70e0c2" stroke-width="2"/><text x="587" y="255" fill="#70e0c2" font-size="16">DOMINIO</text><text x="587" y="295" fill="#fff" font-size="20" font-weight="700">Repositorio</text><text x="587" y="326" fill="#c5d7e7" font-size="15">Contrato de datos</text></g><g><rect x="720" y="205" width="205" height="155" rx="20" fill="#172c40" stroke="#ffc477" stroke-width="2"/><text x="822" y="255" fill="#ffc477" font-size="16">FUENTES</text><text x="822" y="295" fill="#fff" font-size="20" font-weight="700">Datasources</text><text x="822" y="326" fill="#c5d7e7" font-size="15">API y contenido local</text></g><g><rect x="965" y="205" width="190" height="155" rx="20" fill="#172c40" stroke="#ff92b8" stroke-width="2"/><text x="1060" y="255" fill="#ff92b8" font-size="16">PERSISTENCIA</text><text x="1060" y="295" fill="#fff" font-size="20" font-weight="700">Datos guardados</text><text x="1060" y="326" fill="#c5d7e7" font-size="15">Preferencias y errores</text></g></g>
  <g stroke="#70e0c2" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M230 282h34"/><path d="M455 282h34"/><path d="M680 282h34"/><path d="M925 282h34"/></g><text x="600" y="455" fill="#c5d7e7" font-family="Arial,sans-serif" font-size="18" text-anchor="middle">Cada capa delega la responsabilidad de datos a la siguiente.</text>
</svg>
