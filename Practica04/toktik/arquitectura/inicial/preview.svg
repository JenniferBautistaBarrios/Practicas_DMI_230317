<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Arquitectura inicial de KittyTokTik: proveedor local</title>
  <desc id="desc">La presentación consume el estado del proveedor local, que obtiene videos de una lista local y los entrega al reproductor.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#17152b"/><stop offset="1" stop-color="#31204a"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#f8a6cf"/></marker></defs>
  <rect width="1200" height="560" rx="28" fill="url(#bg)"/><text x="56" y="68" fill="#f8a6cf" font-family="Arial,sans-serif" font-size="17" letter-spacing="3">KITTYTOKTIK · ARQUITECTURA INICIAL</text><text x="56" y="116" fill="#fff" font-family="Arial,sans-serif" font-size="34" font-weight="700">Proveedor local</text>
  <g font-family="Arial,sans-serif" text-anchor="middle"><g><rect x="60" y="210" width="235" height="150" rx="20" fill="#27253d" stroke="#f8a6cf" stroke-width="2"/><text x="177" y="265" fill="#f8a6cf" font-size="17">PRESENTACIÓN</text><text x="177" y="306" fill="#fff" font-size="23" font-weight="700">DiscoverScreen</text><text x="177" y="337" fill="#c7c2d8" font-size="16">Feed y reproductor</text></g><g><rect x="350" y="210" width="235" height="150" rx="20" fill="#27253d" stroke="#bc9cff" stroke-width="2"/><text x="467" y="265" fill="#bc9cff" font-size="17">ESTADO</text><text x="467" y="306" fill="#fff" font-size="23" font-weight="700">DiscoverProvider</text><text x="467" y="337" fill="#c7c2d8" font-size="16">Selección y navegación</text></g><g><rect x="640" y="210" width="235" height="150" rx="20" fill="#27253d" stroke="#8ad9cc" stroke-width="2"/><text x="757" y="265" fill="#8ad9cc" font-size="17">DATOS LOCALES</text><text x="757" y="306" fill="#fff" font-size="23" font-weight="700">Lista de videos</text><text x="757" y="337" fill="#c7c2d8" font-size="16">Posts y modelos</text></g><g><rect x="930" y="210" width="220" height="150" rx="20" fill="#27253d" stroke="#ffc477" stroke-width="2"/><text x="1040" y="265" fill="#ffc477" font-size="17">REPRODUCCIÓN</text><text x="1040" y="306" fill="#fff" font-size="23" font-weight="700">Video player</text><text x="1040" y="337" fill="#c7c2d8" font-size="16">Assets multimedia</text></g></g>
  <g stroke="#f8a6cf" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M295 285h48"/><path d="M585 285h48"/><path d="M875 285h48"/></g><text x="600" y="455" fill="#d5cfe3" font-family="Arial,sans-serif" font-size="18" text-anchor="middle">La interfaz observa el proveedor, que sirve contenido desde la colección local.</text>
</svg>
